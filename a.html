<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="a.css">
</head>
<body>
    <div class="heading">
        <h1>Todolist</h1>
    </div>

    <div class="task-adding">
        <input type="text" placeholder="Task description">
        <button class="task-button">Add task</button>
    </div>

    <div class="list">
        <div class="listitem">
            <input type="checkbox" id="item1"><label for="item1">HTML</label>
        </div>

        <div class="listitem">
            <input type="checkbox" id="item2"><label for="item2">CSS</label>
        </div>

        <div class="listitem">
            <input type="checkbox" id="item3"><label for="item3">Bootstrap</label>
        </div>

        <div class="listitem">
            <input type="checkbox" id="item4"><label for="item4">Javascript</label>
        </div>

        <div class="listitem">
            <input type="checkbox" id="item5"><label for="item5">React</label>
        </div>

        <div class="listitem">
            <input type="checkbox" id="item6"><label for="item6">SQL</label>
        </div>

        <div class="listitem">
            <input type="checkbox" id="item7"><label for="item7">Springboot</label>
        </div>        
    </div>

</body>
</html>
